[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictionbot"
version = "1.0.0"
description = "Autonomous research/trading application for Kalshi 15-minute crypto UP/DOWN markets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=42",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.5"]

[project.scripts]
predictionbot = "predictionbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
predictionbot = ["ui/static/*", "persistence/migrations/*.sql", "research/*.json", "_build_info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # random used for jitter only, not crypto
    "RUF001", "RUF002", "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "ASYNC"]
"src/predictionbot/sim/**" = ["S"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["predictionbot"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
